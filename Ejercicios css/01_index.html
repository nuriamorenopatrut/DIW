<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarea 1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .title {
        background-color: #222;
        color: white;
        padding: 1.5rem;
      }
      .list {
        background-color: #c1bfbf;
        display: flex;
        justify-content: space-around;
        list-style: none;
      }
      .list__item {
        border: 1px solid white;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Flexbox</h1>
    <ul class="list">
      <li class="list__item">Enlace 1</li>
      <li class="list__item">Enlace 2</li>
      <li class="list__item">Enlace 3</li>
      <li class="list__item">Enlace 4</li>
    </ul>
  </body>
</html>
